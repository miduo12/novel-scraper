[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deqixs-novel-scraper"
version = "0.2.3"
description = "A resumable Python desktop novel scraper with a Deqixs adapter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]
gui = [
    "PySide6>=6.8,<7",
]
build = [
    "pyinstaller>=6.11,<7",
    "pillow>=11,<13",
]

[project.scripts]
novel-scraper = "novel_scraper.cli:main"
novel-scraper-gui = "novel_scraper.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
novel_scraper = ["resources/*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that access the live website",
]

[tool.ruff]
line-length = 100
target-version = "py310"
