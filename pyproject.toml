[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deqixs-novel-scraper"
version = "0.1.0"
description = "A resumable Python desktop novel scraper with a Deqixs adapter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
novel-scraper = "novel_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that access the live website",
]

[tool.ruff]
line-length = 100
target-version = "py310"
